name: voz diem bao — quet hang ngay 10h

on:
  schedule:
    # 03:00 UTC = 10:00 gio Viet Nam (UTC+7). GitHub chay cron theo UTC.
    # Luu y: cron cua GitHub Actions co the tre 5-30 phut khi runner dong.
    - cron: "0 3 * * *"
  workflow_dispatch:          # cho phep bam Run workflow thu cong
    inputs:
      max_threads:
        description: "Gioi han so thread (0 = tat ca)"
        default: "0"
      top:
        description: "So comment top moi thread"
        default: "20"

concurrency:
  group: voz-diem-bao
  cancel-in-progress: false

permissions:
  contents: write             # can de commit ket qua vao thu muc history/

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cai dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chay test parser (chan viec voz doi markup ma khong ai biet)
        run: python test_parser.py

      - name: Quet voz.vn/f/diem-bao.33
        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          python scrape_voz.py \
            --out-dir output \
            --top "${{ github.event.inputs.top || '20' }}" \
            --max-threads "${{ github.event.inputs.max_threads || '0' }}" \
            --delay 1.5

      - name: Tai ket qua len artifact
        uses: actions/upload-artifact@v4
        with:
          name: voz-diem-bao-${{ github.run_id }}
          path: output/*
          retention-days: 90
          if-no-files-found: error

      - name: Luu lich su vao repo (tuy chon — xoa step nay neu khong muon)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p history
          cp output/* history/ 2>/dev/null || true
          if [ -n "$(git status --porcelain history)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history
            git commit -m "voz diem bao: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Khong co gi moi."
          fi
